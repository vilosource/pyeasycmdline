# release.yml
name: Release Workflow

on:
  push:
    branches:
      - "release/**"
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - run: make dev-install
      - run: make lint
      - run: make test
      - run: make coverage

  semantic-release:
    needs: tests-and-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true


      - name: Fetch tags
        run: git fetch --prune --force --tags

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          version: 1.7.1
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Install dependencies
        run: make dev-install

      - name: Ensure latest python-semantic-release
        run: poetry add --group dev python-semantic-release@^10.0.0

      - name: Run Semantic Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          poetry run semantic-release -vvv version
          poetry run semantic-release -vvv publish 

      - name: Ensure GitHub Release exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag=$(git describe --tags --abbrev=0)
          if ! gh release view "$latest_tag" >/dev/null 2>&1; then
            gh release create "$latest_tag" -t "$latest_tag" -n ""
          fi

      - name: Publish to PyPI
        if: github.ref == 'refs/heads/main'
        env:
          POETRY_PYPI_TOKEN_PYPI: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          poetry build
          poetry publish --username __token__ --password $POETRY_PYPI_TOKEN_PYPI
