[tool.poetry]
name = "pyeasycmdline"
version = "0.1.0"
description = "A YAML-driven command-line interface framework"
authors = ["Your Name <your.email@example.com>"]
readme = "README.md"
packages = [{include = "easycmdline"}]

[tool.poetry.dependencies]
python = "^3.9"
pyyaml = "^6.0"
black = "^25.1.0"
flake8 = "^7.2.0"
pylint = "^3.3.7"
python-semantic-release = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-mock = "^3.10"
mypy = "^1.15.0"
types-pyyaml = "^6.0.12.20250402"
pytest-cov = "^6.1.1"
python-semantic-release = "^8.0.0"

[tool.poetry.scripts]
easycmdline = "easycmdline.cli:run"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pylint]
ignore = ["tests", "easycmdline/tests"]
ignore-patterns = ["test_.*\\.py"]
max-line-length = 120
disable = [
    "missing-module-docstring",
    "missing-class-docstring", 
    "missing-function-docstring",
    "too-few-public-methods",
    "protected-access",
    "redefined-outer-name",
    "import-outside-toplevel",
    "unused-argument",
    "broad-exception-caught"
]

[tool.semantic_release]
version_variable = "easycmdline/__init__.py:__version__"
# Force install latest python-semantic-release in workflow to guarantee correct version
branches = [
  { name = "main" },
  { name = "release/**", prerelease = "rc" }
]
